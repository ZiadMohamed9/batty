<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bat Pixel Animation</title>
  <style>
    /* SCSS Vars
      *
      * 1. Colors, $a(outline), $b(body), $c(eyes)
      * 2. Modify $size for different bat sizes.
      * 3. Modify $speed for different speeds.
      */
    /* 1 */
    /* 1 */
    /* 1 */
    /* 2 */
    /* 3 */
    /* Scaffolding */
    :root {
      --bat-body: #202020;
      --bat-edge: #54556b;
      --bat-eye: #ffffff;
      --page: oklch(88% 0.006 300);
      --surface: oklch(96% 0.006 300);
      --surface-raised: oklch(93.5% 0.008 300);
      --ink: oklch(25% 0.02 305);
      --muted: oklch(43% 0.03 305);
      --accent: oklch(57% 0.2 345);
      --focus: oklch(61% 0.2 345);
      --border: oklch(79% 0.012 300);
      --border-strong: oklch(69% 0.018 300);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      height: 100%;
    }

    body {
      min-height: 100vh;
      padding: 32px 20px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--page);
      font-family: ui-monospace, "Cascadia Mono", "Segoe UI Mono", monospace;
    }

    button,
    input {
      font: inherit;
    }

    .customizer {
      width: min(100%, 560px);
      text-align: center;
    }

    .title {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: oklch(47% 0.2 350);
    }

    .pixel-title {
      --pixel: clamp(1.2px, 0.34vw, 2.6px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--pixel);
    }

    .pixel-glyph {
      width: calc(var(--pixel) * 5);
      height: calc(var(--pixel) * 7);
      position: relative;
      flex: none;
    }

    .pixel-glyph::before {
      content: "";
      width: calc(var(--pixel) * 1.28);
      height: calc(var(--pixel) * 1.28);
      position: absolute;
      inset: 0 auto auto 0;
      box-shadow: var(--glyph-pixels);
    }

    .pixel-space {
      width: calc(var(--pixel) * 3);
    }

    .title-emoji {
      flex: none;
      font-size: 1.7rem;
      line-height: 1;
    }

    .bat-stage {
      min-height: 286px;
      margin: 22px 0 20px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      background: var(--surface);
    }

    .hearts {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .pixel-heart {
      width: var(--size);
      height: var(--size);
      position: absolute;
      top: calc(100% + 24px);
      left: var(--x);
      opacity: 0;
      color: var(--heart-color);
      background: currentColor;
      clip-path: polygon(0 20%, 20% 20%, 20% 0, 40% 0, 40% 20%,
          60% 20%, 60% 0, 80% 0, 80% 20%, 100% 20%,
          100% 60%, 80% 60%, 80% 80%, 60% 80%, 60% 100%,
          40% 100%, 40% 80%, 20% 80%, 20% 60%, 0 60%);
      animation: float-heart var(--duration) steps(18, end) var(--delay) infinite;
    }

    @keyframes float-heart {
      0% {
        opacity: 0;
        transform: translate3d(0, 24px, 0) scale(0.8);
      }

      12%,
      72% {
        opacity: 0.72;
      }

      100% {
        opacity: 0;
        transform: translate3d(var(--drift), -340px, 0) scale(1);
      }
    }

    .bat-wrap {
      width: 244px;
      height: 244px;
      padding: 0;
      position: relative;
      z-index: 1;
      flex: none;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      transition: filter 160ms ease-out, transform 160ms ease-out;
    }

    .bat-wrap:hover {
      filter: brightness(1.12);
    }

    .bat-wrap:active {
      transform: translateY(2px);
    }

    .bat-wrap:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: -3px;
    }

    .heart-burst {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .burst-heart {
      width: var(--size);
      height: var(--size);
      position: absolute;
      top: 50%;
      left: 50%;
      color: var(--heart-color);
      background: currentColor;
      clip-path: polygon(0 20%, 20% 20%, 20% 0, 40% 0, 40% 20%,
          60% 20%, 60% 0, 80% 0, 80% 20%, 100% 20%,
          100% 60%, 80% 60%, 80% 80%, 60% 80%, 60% 100%,
          40% 100%, 40% 80%, 20% 80%, 20% 60%, 0 60%);
      animation: burst-heart 760ms steps(8, end) forwards;
    }

    @keyframes burst-heart {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate3d(var(--dx), var(--dy), 0) scale(1);
      }
    }

    .bat-surprise {
      margin: 0;
      position: absolute;
      bottom: 15px;
      left: 50%;
      z-index: 3;
      color: oklch(50% 0.18 350);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      opacity: 0;
      transform: translate(-50%, 5px);
      transition: opacity 180ms ease-out, transform 180ms ease-out;
      pointer-events: none;
    }

    .bat-surprise.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Bat */
    .bat {
      width: 1px;
      height: 1px;
      transform: scale(4);
      transform-origin: top left;
      position: absolute;
      inset: 0 auto auto 0;
      -webkit-animation: 0.4s bat steps(1) infinite;
      animation: 0.4s bat steps(1) infinite;
    }

    .controls {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-raised);
      text-align: left;
    }

    .controls-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .controls-heading h2 {
      margin: 0;
      font-size: 0.92rem;
      letter-spacing: 0.01em;
    }

    .selection-status {
      margin: 0;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(36px, 1fr));
      gap: 9px;
    }

    .swatch {
      aspect-ratio: 1;
      min-width: 0;
      position: relative;
      border: 0;
      border-radius: 9px;
      background: var(--swatch);
      cursor: pointer;
      transition: transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .swatch:hover {
      transform: translateY(-2px);
    }

    .swatch[aria-pressed="true"]::after {
      content: "✓";
      position: absolute;
      inset: 5px;
      display: grid;
      place-items: center;
      border: 2px solid currentColor;
      border-radius: 6px;
      color: var(--mark, #ffffff);
      font-size: 1rem;
      font-weight: 800;
      line-height: 1;
    }

    .swatch:focus-visible,
    .custom-color:focus-visible,
    .reset-button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .control-footer {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .custom-picker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .custom-color {
      width: 36px;
      height: 30px;
      padding: 2px;
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }

    .custom-color::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .custom-color::-webkit-color-swatch {
      border: 0;
      border-radius: 4px;
    }

    .reset-button {
      padding: 8px 11px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      transition: background-color 180ms ease-out, border-color 180ms ease-out;
    }

    .reset-button:hover {
      border-color: var(--accent);
      background: oklch(91% 0.035 345);
    }

    @media (max-width: 440px) {
      body {
        padding: 24px 14px;
      }

      .title {
        gap: 8px;
      }

      .pixel-title {
        --pixel: 1.15px;
      }

      .title-emoji {
        font-size: 1.35rem;
      }

      .bat-stage {
        min-height: 226px;
      }

      .bat-wrap {
        width: 183px;
        height: 183px;
      }

      .bat {
        transform: scale(3);
      }

      .color-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bat {
        animation-play-state: paused;
        -webkit-animation-play-state: paused;
      }

      .pixel-heart {
        top: var(--static-y);
        opacity: 0.42;
        animation: none;
      }

      .bat-wrap,
      .bat-surprise,
      .swatch,
      .reset-button {
        transition: none;
      }
    }

    const pixelGlyphs = {
      A: ['01110', '10001', '10001', '11111', '10001', '10001', '10001'],
      B: ['11110', '10001', '10001', '11110', '10001', '10001', '11110'],
      E: ['11111', '10000', '10000', '11110', '10000', '10000', '11111'],
      F: ['11111', '10000', '10000', '11110', '10000', '10000', '10000'],
      G: ['01111', '10000', '10000', '10111', '10001', '10001', '01111'],
      I: ['11111', '00100', '00100', '00100', '00100', '00100', '11111'],
      J: ['00111', '00010', '00010', '00010', '10010', '10010', '01100'],
      L: ['10000', '10000', '10000', '10000', '10000', '10000', '11111'],
      M: ['10001', '11011', '10101', '10101', '10001', '10001', '10001'],
      N: ['10001', '11001', '10101', '10011', '10001', '10001', '10001'],
      O: ['01110', '10001', '10001', '10001', '10001', '10001', '01110'],
      P: ['11110', '10001', '10001', '11110', '10000', '10000', '10000'],
      R: ['11110', '10001', '10001', '11110', '10100', '10010', '10001'],
      S: ['01111', '10000', '10000', '01110', '00001', '00001', '11110'],
      T: ['11111', '00100', '00100', '00100', '00100', '00100', '00100'],
      U: ['10001', '10001', '10001', '10001', '10001', '10001', '01110'],
      Y: ['10001', '10001', '01010', '00100', '00100', '00100', '00100']
    };

    const burstDirections = [
      { x: '-88px', y: '-72px', size: '13px', color: '#ff6fae' },
      { x: '-48px', y: '-104px', size: '10px', color: '#ff9bc5' },
      { x: '0px', y: '-118px', size: '15px', color: '#e34f98' },
      { x: '52px', y: '-102px', size: '9px', color: '#ff87b9' },
      { x: '92px', y: '-66px', size: '13px', color: '#d7448c' },
      { x: '-98px', y: '-18px', size: '9px', color: '#ff8fbd' },
      { x: '100px', y: '-12px', size: '11px', color: '#f260a3' },
      { x: '0px', y: '-70px', size: '8px', color: '#ffc0d8' }
    ];

    const pixelTitle = document.querySelector('#pixel-title');
    const batButton = document.querySelector('#bat-button');
    const heartBurst = document.querySelector('#heart-burst');
    const batSurprise = document.querySelector('#bat-surprise');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const root = document.documentElement;
    const swatches = [...document.querySelectorAll('.swatch')];
    const customColor = document.querySelector('#custom-color');
    const resetButton = document.querySelector('#reset-button');
    const selectionStatus = document.querySelector('#selection-status');
    const defaultColor = '#202020';
    let surpriseTimeout;

    function glyphShadow(bitmap) {
      return bitmap.flatMap((bitmapRow, rowIndex) => [...bitmapRow].flatMap((pixel, columnIndex) => (
        pixel === '1'
          ? [`calc(var(--pixel) * ${columnIndex}) calc(var(--pixel) * ${rowIndex}) 0 currentColor`]
          : []
      ))).join(',');
    }

    function createPixelGlyph(character) {
      const glyph = document.createElement('span');
      glyph.className = character === ' ' ? 'pixel-glyph pixel-space' : 'pixel-glyph';
      if (character !== ' ') glyph.style.setProperty('--glyph-pixels', glyphShadow(pixelGlyphs[character]));
      return glyph;
    }

    function renderPixelTitle(text) {
      const titleFragment = document.createDocumentFragment();
      [...text].forEach((character) => titleFragment.append(createPixelGlyph(character)));
      pixelTitle.append(titleFragment);
    }

    function createBurstHeart({ x, y, size, color }) {
      const heart = document.createElement('span');
      heart.className = 'burst-heart';
      heart.style.setProperty('--dx', x);
      heart.style.setProperty('--dy', y);
      heart.style.setProperty('--size', size);
      heart.style.setProperty('--heart-color', color);
      heart.addEventListener('animationend', () => heart.remove(), { once: true });
      return heart;
    }

    function releaseHeartBurst() {
      const burstFragment = document.createDocumentFragment();
      burstDirections.forEach((direction) => burstFragment.append(createBurstHeart(direction)));
      heartBurst.append(burstFragment);
    }

    function revealBatSurprise() {
      batSurprise.textContent = 'BATTYYYYYYYY 🦇🦇';
      batSurprise.classList.add('is-visible');
      window.clearTimeout(surpriseTimeout);
      surpriseTimeout = window.setTimeout(() => {
        batSurprise.classList.remove('is-visible');
        batSurprise.textContent = '';
      }, 1200);
    }

    function celebrateOlia() {
      if (!reducedMotion.matches) releaseHeartBurst();
      revealBatSurprise();
    }

    function mixWithWhite(hex, whiteAmount = 0.3) {
      const normalizedHex = hex.replace('#', '');
      const channels = [0, 2, 4].map((index) => parseInt(normalizedHex.slice(index, index + 2), 16));
      const mixedChannels = channels.map((channel) => Math.round(channel + (255 - channel) * whiteAmount));
      return `#${mixedChannels.map((channel) => channel.toString(16).padStart(2, '0')).join('')}`;
    }

    function setBatColor(color, colorName, selectedSwatch = null) {
      root.style.setProperty('--bat-body', color);
      root.style.setProperty('--bat-edge', color === defaultColor ? '#54556b' : mixWithWhite(color));
      customColor.value = color;
      swatches.forEach((swatch) => swatch.setAttribute('aria-pressed', String(swatch === selectedSwatch)));
      selectionStatus.textContent = `${colorName} selected`;
    }

    swatches.forEach((swatch) => {
      swatch.addEventListener('click', () => {
        setBatColor(swatch.dataset.color, swatch.dataset.name, swatch);
      });
    });

    customColor.addEventListener('input', () => {
      setBatColor(customColor.value, 'Custom');
    });

    resetButton.addEventListener('click', () => {
      setBatColor(defaultColor, 'Midnight', swatches[0]);
      swatches[0].focus();
    });

    batButton.addEventListener('click', celebrateOlia);
    renderPixelTitle('I AM BATMAN 🦇🦇🦇');
  </script>
</body>

</html>
